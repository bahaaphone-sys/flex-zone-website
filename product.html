<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101010">
<title>FLEX ZONE | تفاصيل المنتج</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:white;font-family:system-ui,-apple-system,sans-serif}header{background:#090909;padding:18px;text-align:center}header a{color:#f5c842;font-size:25px;font-weight:900;text-decoration:none}main{max-width:650px;margin:auto;padding:18px 16px 38px}.back{display:inline-block;color:#ddd;margin-bottom:14px}.product{background:#191919;border:1px solid #333;border-radius:16px;overflow:hidden}.product img{width:100%;height:auto;max-height:620px;object-fit:contain;background:#fff;display:block}.details{padding:18px}.name{font-size:23px;font-weight:800;margin:0 0 12px}.price{font-size:26px;color:#f5c842;font-weight:900;margin:0 0 16px;direction:ltr;text-align:right}.description{line-height:1.8;color:#ddd}.metadata{margin:12px 0;color:#ccc}.size-heading{margin:20px 0 10px;font-weight:800}.sizes{display:flex;gap:8px;flex-wrap:wrap}.size-btn{background:#202020;color:white;border:1px solid #aaa;border-radius:9px;padding:12px 16px;cursor:pointer;font:inherit}.size-btn[aria-pressed=true]{border-color:#f5c842;background:#f5c842;color:#111;font-weight:900}.custom-size{width:100%;padding:13px;border:1px solid #aaa;background:#111;color:white;border-radius:9px;font:inherit}.order{display:block;width:100%;margin-top:22px;padding:16px;background:#128c4a;color:white;border:0;border-radius:12px;font:inherit;font-weight:900;text-decoration:none;text-align:center;cursor:pointer}.status{color:#ddd;line-height:1.7}.error{color:#ffb4a9}
</style>
</head>
<body>
<header><a href="./gallery.html">👑 FLEX ZONE</a></header>
<main>
<a class="back" href="./gallery.html">← العودة لمعرض المنتجات</a>
<p id="status" class="status">عم نحمّل تفاصيل المنتج…</p>
<article id="product" class="product" hidden>
<img id="image" alt="">
<div class="details">
<h1 id="name" class="name"></h1>
<p id="price" class="price"></p>
<p id="description" class="description"></p>
<p id="colors" class="metadata"></p>
<p id="size-heading" class="size-heading">المقاس المطلوب</p>
<div id="sizes" class="sizes" role="group" aria-label="اختيار المقاس"></div>
<input id="custom-size" class="custom-size" type="text" placeholder="اكتب المقاس المطلوب" autocomplete="off" hidden>
<button id="order" class="order" type="button">اطلب عبر واتساب</button>
<p id="error" class="error" role="alert"></p>
</div>
</article>
</main>
<script>
(function(){
const id=new URLSearchParams(location.search).get('id')||'';
const match=/^FZ-(\d{4,})$/.exec(id);
const status=document.getElementById('status'),card=document.getElementById('product');
if(!match){status.textContent='رابط المنتج غير صحيح.';return;}
const index=Number(match[1])-1;
fetch('./products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unable to load');return r.json();}).then(items=>{
const p=items[index];if(!p||p.available===false||!p.image){status.textContent='هيدا المنتج مش متوفر حاليًا.';return;}
document.title=p.name+' | FLEX ZONE';
document.getElementById('name').textContent=p.name||'';
document.getElementById('price').textContent=Number(p.price).toFixed(2)+' USD';
document.getElementById('description').textContent=p.description||'';
document.getElementById('colors').textContent=p.colors?'اللون: '+p.colors:'';
const img=document.getElementById('image');img.src=new URL('./'+String(p.image).replace(/^\/+/,''),location.href).href;img.alt=p.name||'صورة المنتج';
let selected='';
const raw=Array.isArray(p.sizes)?p.sizes:(typeof p.sizes==='string'?[p.sizes]:[]);
const choices=raw.flatMap(v=>{const s=String(v||'').trim();return /^(?:(?:[smlx]{1,3}|[2-9]xl|\d{2,3}(?:\.\d{1,2})?)(?:[\s,،;/|·]+|$))+$/i.test(s)?s.split(/[\s,،;/|·]+/):[s];}).map(s=>s.trim().toUpperCase()).filter((s,i,a)=>s&&a.indexOf(s)===i);
const panel=document.getElementById('sizes'),input=document.getElementById('custom-size');
if(choices.length){choices.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='size-btn';b.textContent=s;b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=s;for(const c of panel.children)c.setAttribute('aria-pressed',String(c===b));document.getElementById('error').textContent='';};panel.append(b);});document.getElementById('size-heading').textContent='اختار المقاس المتوفر';}
else{input.hidden=false;document.getElementById('size-heading').textContent='اكتب المقاس المطلوب (منأكدلك التوفر عبر واتساب)';}
document.getElementById('order').onclick=()=>{
const size=choices.length?selected:input.value.trim();
if(!size){document.getElementById('error').textContent='حدّد المقاس قبل ما تكمّل الطلب.';if(!choices.length)input.focus();return;}
const message='مرحبا، بدي '+p.name+(p.colors?' ('+p.colors+')':'')+'. السعر '+p.price+'$، مقاسي '+size+'.';
window.location.assign('https://wa.me/96170828465?text='+encodeURIComponent(message));
};
status.hidden=true;card.hidden=false;
}).catch(()=>{status.textContent='ما قدرنا نحمّل تفاصيل المنتج. جرّب تحديث الصفحة.';});
})();
</script>
</body>
</html>
