name: Find larger catalog image candidates
on:
  push:
    paths:
      - find_larger_catalog_images.py
      - .github/workflows/find-larger-catalog-images.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Scan larger image copies without modifying products
        run: python find_larger_catalog_images.py
      - uses: actions/upload-artifact@v4
        with:
          name: meta-larger-image-candidates
          path: meta-larger-image-candidates.json
