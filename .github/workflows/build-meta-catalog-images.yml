name: Build Meta catalog image copies
on:
  push:
    paths:
      - build_meta_catalog_images.py
      - .github/workflows/build-meta-catalog-images.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meta-catalog-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tooling
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate JPEG copies and review feed
        run: python build_meta_catalog_images.py
      - name: Commit only generated catalog files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- meta-images/ meta-catalog-ready-review.csv meta-image-conversion-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate Meta-only JPEG copies and catalog review feed"
            git push
          else
            echo "Generated catalog assets are unchanged."
          fi
      - name: Upload conversion report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meta-image-conversion-report
          path: meta-image-conversion-report.json
          if-no-files-found: warn
