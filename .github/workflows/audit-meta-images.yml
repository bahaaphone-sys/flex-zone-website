name: Audit Meta catalog images
on:
  push:
    paths:
      - audit_meta_images.py
      - .github/workflows/audit-meta-images.yml
      - products.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image inspection library
        run: python -m pip install 'Pillow>=10,<13'
      - name: Inspect images without modifying originals
        run: python audit_meta_images.py
      - name: Attach image audit report
        uses: actions/upload-artifact@v4
        with:
          name: meta-image-audit-report
          path: meta-image-audit-report.json
