name: Refresh GitHub Pages product catalog

on:
  push:
    branches:
      - main
    paths:
      - gallery.html
      - products.json
      - .github/workflows/refresh-pages.yml

permissions:
  contents: read
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
