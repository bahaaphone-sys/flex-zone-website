<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLEX ZONE | Products</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}
header{background:#0c0c0c;padding:24px;text-align:center;font-size:30px;font-weight:900;color:#f9c638}
main{max-width:1050px;margin:auto;padding:24px}
#catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.product{background:#222;border-radius:14px;overflow:hidden}
.product img{display:block;width:100%;height:280px;object-fit:contain;background:#191919}
.content{padding:18px}
.price{font-size:24px;color:#f9c638;font-weight:800}
a.order{display:block;background:#0b9151;color:white;text-decoration:none;text-align:center;padding:14px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<header>FLEX ZONE 👑</header>
<main>
<h1>المنتجات الجديدة</h1>
<section id="catalog">عم نحمّل المنتجات...</section>
</main>
<script>
const root = document.getElementById("catalog");

fetch("./products.json", {cache:"no-store"})
.then(r => {
  if (!r.ok) throw Error();
  return r.json();
})
.then(items => {
  const fragment = document.createDocumentFragment();

  items.filter(p => p.available !== false).forEach((p, index) => {
    const card = document.createElement("article");
    card.className = "product";

    const img = document.createElement("img");
    img.width = 600;
    img.height = 600;
    img.alt = p.name;
    img.loading = index < 2 ? "eager" : "lazy";
    img.decoding = "async";
    if (index === 0) img.fetchPriority = "high";
    img.src = "." + p.image;
    card.append(img);

    const c = document.createElement("div");
    c.className = "content";

    const h = document.createElement("h2");
    h.textContent = p.name;

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = "$" + p.price;

    const colors = document.createElement("p");
    colors.textContent = "الألوان: " + (p.colors || "اسأل عن الألوان");

    const desc = document.createElement("p");
    desc.textContent = p.description || "";

    const order = document.createElement("a");
    order.className = "order";
    order.textContent = "اطلب عبر واتساب";
    order.href = "https://wa.me/96170828465?text=" +
      encodeURIComponent(
        "مرحبا، بدي أطلب " + p.name +
        " - السعر $" + p.price + " - اللون: "
      );

    c.append(h, price, colors, desc, order);
    card.append(c);
    fragment.append(card);
  });

  root.replaceChildren(fragment);
  if (!root.children.length) {
    root.textContent = "ما في منتجات حالياً";
  }
})
.catch(() => {
  root.textContent = "ما قدرنا نحمّل المنتجات، جرّب من جديد.";
});
</script>
</body>
</html>
