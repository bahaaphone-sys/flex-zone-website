<!DOCTYPE html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FLEX ZONE | Products</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#fff}header{background:#0c0c0c;padding:24px;text-align:center;font-size:30px;font-weight:900;color:#f9c638}main{max-width:1050px;margin:auto;padding:24px}#catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.product{background:#222;border-radius:14px;overflow:hidden}.product img{width:100%;height:280px;object-fit:cover}.content{padding:18px}.price{font-size:24px;color:#f9c638;font-weight:800}a.order{display:block;background:#0b9151;color:white;text-decoration:none;text-align:center;padding:14px;border-radius:10px;font-weight:700}</style><header>FLEX ZONE 👑</header><main><h1>المنتجات الجديدة</h1><section id="catalog">عم نحمّل المنتجات...</section></main><script>const root=document.getElementById("catalog");fetch("./products.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{root.textContent="";items.filter(p=>p.available!==false).forEach(p=>{let card=document.createElement("article");card.className="product";let img=document.createElement("img");img.src="."+p.image;img.alt=p.name;card.append(img);let c=document.createElement("div");c.className="content";let h=document.createElement("h2");h.textContent=p.name;let price=document.createElement("p");price.className="price";price.textContent="$"+p.price;let colors=document.createElement("p");colors.textContent="الألوان: "+(p.colors||"اسأل عن الألوان");let desc=document.createElement("p");desc.textContent=p.description||"";let order=document.createElement("a");order.className="order";order.textContent="اطلب عبر واتساب";order.href="https://wa.me/96170828465?text="+encodeURIComponent("مرحبا، بدي أطلب "+p.name+" - السعر $"+p.price+" - اللون: ");c.append(h,price,colors,desc,order);card.append(c);root.append(card)});if(!root.children.length)root.textContent="ما في منتجات حالياً"}).catch(()=>root.textContent="ما قدرنا نحمّل المنتجات، جرّب من جديد.")</script></html>
