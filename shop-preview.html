const categories=[['all','الكل'],['jersey','قمصان الفرق'],['tracksuit','أطقم رياضية'],['hoodie','كنزات وهوديز'],['jacket','جاكيتات'],['pants','بناطيل'],['shoes','أحذية'],['socks','جوارب']];
const categoryWords={jersey:'كنزة كنزه قميص قمصان تيشيرت تيشرت فوتبول فوتبال كرة قدم كره قدم football jersey shirt',tracksuit:'طقم اطقم بيجامة بيجامه بجامة بجماعه رياضي رياضية سبور tracksuit set',hoodie:'كنزة كنزه كنزات هودي هوديز سويت شيرت sweatshirt hoodie',jacket:'جاكيت جاكت جاكتات جاكيتات jacket coat',pants:'بنطلون بناطيل سروال pants trousers jogger',shoes:'حذاء احذية جزمة جزمات كندرة كندره شوز shoes sneakers',socks:'جوارب كلسات جرابات socks'};
const teams=[[/real madrid/i,'ريال مدريد ريالمدريد ملكي'],[/barcelona/i,'برشلونة برشلونه برشا'],[/manchester united/i,'مانشستر يونايتد مان يونايتد'],[/manchester city/i,'مانشستر سيتي مان سيتي'],[/liverpool/i,'ليفربول'],[/arsenal/i,'ارسنال ارسنال'],[/juventus/i,'يوفنتوس يوفنتس'],[/bayern/i,'بايرن ميونخ بايرن ميونيخ'],[/dortmund/i,'دورتموند بروسيا بوروسيا'],[/paris|psg/i,'باريس سان جيرمان باريس سان جرمان بي اس جي'],[/germany/i,'المانيا المانيا'],[/ac milan/i,'ميلان اي سي ميلان'],[/nike/i,'نايك نايكي'],[/adidas/i,'اديداس'],[/on cloud/i,'اون كلاود اونكلود'],[/north face/i,'نورث فيس ذا نورث فيس'],[/jordan/i,'جوردان']];
const normalize=s=>String(s??'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f\u064b-\u065f\u0670ـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function category(p){const n=p.name||'';if(/tracksuit|winter set/i.test(n))return 'tracksuit';if(/jersey|football shirt/i.test(n))return 'jersey';if(/hoodie|sweatshirt/i.test(n))return 'hoodie';if(/jacket|puffer/i.test(n))return 'jacket';if(/pants|jogger|trousers/i.test(n))return 'pants';if(/shoes|sneaker/i.test(n))return 'shoes';if(/socks/i.test(n))return 'socks';return 'all';}
function searchText(p){const n=p.name||'';const c=category(p);let extra=categoryWords[c]||'';for(const [pattern,words]of teams)if(pattern.test(n))extra+=' '+words;if(/tracksuit/i.test(n)&&/madrid|barcelona|liverpool|arsenal|juventus|bayern|dortmund|paris|psg|germany|milan/i.test(n))extra+=' فرق فريق فوتبول كرة قدم';const text=[p.name,p.description,p.colors,extra].join(' ');return normalize(text);}
function imageURL(path){if(typeof path!=='string'||!path)return '';return new URL('./'+path.replace(/^\/+/,''),location.href).href;}
function priceText(p){return Number(p.price)>0?'$'+p.price:'اسأل عن السعر';}
function orderURL(p){return 'https://wa.me/96170828465?text='+encodeURIComponent('مرحبا، بدي اسأل عن '+p.name+(Number(p.price)>0?' - السعر $'+p.price:'')+' - اللون: '+' - المقاس: ');}
let products=[],indexed=[],active='all',visible=24,lastMatches=[];
function openDetails(p){$('detail-name').textContent=p.name||'';$('detail-price').textContent=priceText(p);$('detail-colors').textContent='الألوان: '+(p.colors||'اسأل عن الألوان');$('detail-description').textContent=p.description||'';const sizes=Array.isArray(p.sizes)?p.sizes.join('، '):p.sizes;$('detail-sizes').textContent=sizes?'المقاسات: '+sizes:'للمقاسات المتوفّرة، اسألنا عبر واتساب.';const img=$('detail-image');img.alt=p.name||'';const url=imageURL(p.image);img.hidden=!url;if(url)img.src=url;else img.removeAttribute('src');const original=imageURL(p.originalImage||originalImages[p.image]||p.image);$('original').hidden=!original;if(original)$('original').href=original;else $('original').removeAttribute('href');$('detail-order').href=orderURL(p);$('details').showModal();}
function card(p,index){const article=document.createElement('article');article.className='product';const photo=document.createElement('button');photo.className='image-button';photo.type='button';photo.setAttribute('aria-label','شوف تفاصيل '+p.name);const img=document.createElement('img');img.width=600;img.height=600;img.alt=p.name||'';img.loading=index<2?'eager':'lazy';img.decoding='async';if(index===0)img.fetchPriority='high';const url=imageURL(p.image);if(url)img.src=url;else img.alt='الصورة غير متوفّرة — '+(p.name||'');photo.append(img);photo.onclick=()=>openDetails(p);const c=document.createElement('div');c.className='content';const h=document.createElement('h2');h.dir='auto';h.textContent=p.name;const price=document.createElement('p');price.className='price';price.dir='auto';price.textContent=priceText(p);const btn=document.createElement('button');btn.className='detail-button';btn.type='button';btn.textContent='شوف التفاصيل';btn.onclick=()=>openDetails(p);const order=document.createElement('a');order.className='order';order.href=orderURL(p);order.target='_blank';order.rel='noopener';order.textContent='اطلب عبر واتساب';c.append(h,price,btn,order);article.append(photo,c);return article;}
function render(reset=true){if(reset)visible=24;const terms=normalize($('search').value).split(' ').filter(Boolean);lastMatches=indexed.filter(x=>(active==='all'||x.category===active)&&terms.every(t=>x.text.includes(t)));const fragment=document.createDocumentFragment();lastMatches.slice(0,visible).forEach((x,i)=>fragment.append(card(x.product,i)));$('catalog').replaceChildren(fragment);$('empty').hidden=lastMatches.length>0;$('more').hidden=lastMatches.length<=visible;$('results-status').textContent=lastMatches.length+' قطعة'+(lastMatches.length>visible?' · عم نعرض أول '+visible:'');for(const button of $('filters').children)button.setAttribute('aria-pressed',String(button.dataset.category===active));}
for(const [id,label]of categories){const b=document.createElement('button');b.type='button';b.className='filter';b.dataset.category=id;b.textContent=label;b.setAttribute('aria-pressed',String(id==='all'));b.onclick=()=>{active=id;render();};$('filters').append(b);}
let timer;$('search').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>render(),120);});$('clear').onclick=()=>{clearTimeout(timer);$('search').value='';active='all';render();$('search').focus();};$('more').onclick=()=>{visible+=24;render(false);};$('close').onclick=()=>$('details').close();$('details').addEventListener('click',e=>{if(e.target===$('details')){const r=$('details').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('details').close();}});
fetch('./products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json();}).then(items=>{if(!Array.isArray(items))throw Error();products=items.filter(p=>p.available!==false);indexed=products.map(product=>({product,category:category(product),text:searchText(product)}));render();}).catch(()=>{$('results-status').textContent='ما قدرنا نحمّل المنتجات. جرّب حدّث الصفحة.';});
</script>
